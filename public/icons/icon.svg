<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b19" />
      <stop offset="100%" stop-color="#352e2b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" />
  
  <!-- Outer Gold Diamond Accent -->
  <polygon points="256,60 452,256 256,452 60,256" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.35" />
  
  <!-- Central Atelier Serif Monogram 'A' -->
  <text x="256" y="310" font-family="'EB Garamond', Garamond, 'Times New Roman', serif" font-size="240" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">A</text>
  
  <!-- Subtitle Text -->
  <text x="256" y="380" font-family="'DM Sans', sans-serif" font-size="28" font-weight="600" fill="#fbf2ef" text-anchor="middle" letter-spacing="12">ATELIER</text>
  <text x="256" y="415" font-family="'DM Sans', sans-serif" font-size="18" font-weight="500" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="8">POS &amp; KASIR</text>
</svg>
